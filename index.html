<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InferMatrix深圳开发组 · 贡献报告</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: #f4f6fb; color: #1a2233; }
  header.top { background: linear-gradient(135deg, #3730a3 0%, #4f46e5 55%, #6d28d9 100%); color: #fff;
    padding: 16px 24px 14px; box-shadow: 0 4px 16px rgba(79, 70, 229, .25); }
  header.top h1 { font-size: 19px; font-weight: 700; letter-spacing: .5px; }
  header.top .sub { font-size: 12px; opacity: .8; margin-top: 2px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .tabs button { font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1px solid rgba(255,255,255,.45); background: rgba(255,255,255,.12); color: #fff;
    border-radius: 999px; padding: 5px 16px; transition: all .15s; }
  .tabs button:hover { background: rgba(255,255,255,.25); }
  .tabs button.active { background: #fff; color: #4f46e5; border-color: #fff; }
  iframe { width: 100%; height: calc(100vh - 128px); border: 0; display: block; background: #f4f6fb; }
  .err { padding: 24px; color: #5a6478; font-size: 14px; }
</style>
</head>
<body>
<header class="top">
  <h1>InferMatrix深圳开发组 · 贡献报告</h1>
  <div class="sub">vllm-project/vllm-omni ｜ 点击日期标签切换各期报告</div>
  <div class="tabs" id="tabs"></div>
</header>
<iframe id="frame" title="报告内容"></iframe>
<script>
  const frame = document.getElementById('frame');
  const tabs = document.getElementById('tabs');
  function select(item) {
    frame.src = item.file;
    history.replaceState(null, '', '#' + encodeURIComponent(item.file.replace('reports/', '')));
    [...tabs.children].forEach(b => b.classList.toggle('active', b.dataset.file === item.file));
  }
  fetch('reports/list.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('list ' + r.status); return r.json(); })
    .then(list => {
      if (!Array.isArray(list) || !list.length) { tabs.innerHTML = '<span class="err">暂无报告</span>'; return; }
      for (const item of list) {
        const b = document.createElement('button');
        b.textContent = item.label;
        b.dataset.file = item.file;
        b.onclick = () => select(item);
        tabs.appendChild(b);
      }
      const hash = decodeURIComponent(location.hash.slice(1));
      const target = list.find(i => i.file === 'reports/' + hash) || list[0];
      select(target);
    })
    .catch(() => { tabs.innerHTML = '<span class="err">报告列表加载失败，请稍后刷新</span>'; });
</script>
</body>
</html>
